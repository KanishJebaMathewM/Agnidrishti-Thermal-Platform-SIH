name: AGNIDRISHTI CI/CD Pipeline

on:
  push:
    branches: [main, 'feat/**', 'anuvarshini', 'ishanth', 'integration/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.14, not the original spec's 3.11: ml/requirements.txt and
          # workers/requirements.txt are pinned to versions verified on 3.14
          # (numpy==2.5.2 in particular has dropped 3.11 support entirely —
          # discovered via a real `docker build` failure, not just inspection).
          # README.md's stated prerequisite is "Python 3.11+", so this still
          # satisfies it. deployment/docker/{backend,worker}.Dockerfile match.
          python-version: '3.14'
      # backend/app/api/routes/model.py imports workers.inference.inference_worker,
      # which imports ml/ at module level — and workers/tests + ml/tests are their
      # own contributor domains — so all three requirements files are needed here,
      # not just backend/requirements.txt.
      - name: Install backend, workers, and ml dependencies
        run: |
          python -m pip install --upgrade pip
          test -f backend/requirements.txt
          test -f workers/requirements.txt
          test -f ml/requirements.txt
          pip install -r backend/requirements.txt -r workers/requirements.txt -r ml/requirements.txt
          pip install pytest ruff
      - name: Run backend, workers (Contributor 2/3/5), ml, and deployment-config tests
        run: pytest backend/tests workers/tests ml deployment/tests
      - name: Lint Python
        run: ruff check backend workers ml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose -f deployment/docker-compose.prod.yml config
      - name: Build production services
        run: docker compose -f deployment/docker-compose.prod.yml build
