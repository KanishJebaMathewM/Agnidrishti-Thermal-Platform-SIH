name: AGNIDRISHTI CI/CD Pipeline

on:
  push:
    branches: [main, 'feat/**', 'anuvarshini']
  pull_request:
    branches: [main]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          test -f backend/requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest ruff
      - name: Run backend and Contributor 5 tests
        run: pytest backend/tests workers/tests
      - name: Lint Python
        run: ruff check backend workers

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose -f deployment/docker-compose.prod.yml config
      - name: Build production services
        run: docker compose -f deployment/docker-compose.prod.yml build
